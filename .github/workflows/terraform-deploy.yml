name: Terraform Deploy

on:
  push:
    branches:
      - restaurantmanage  # 改为监听当前分支
    paths:
      - "infra/main/**"
      - "lambdas/**"      # 监听所有Lambda代码变更

permissions:
  issues: write       # 给 manual-approval 用
  contents: read      # checkout 和其他步骤需要
  actions: read       # workflow 本身执行需要

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Lambda打包步骤
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Package Lambda Functions
        run: |
          echo "📦 Starting Lambda function packaging..."
          
          # 打包 emenu_server
          echo "📦 Packaging emenu_server..."
          cd lambdas/emenu_server
          npm ci --production --silent
          zip -r emenu_server.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
          cd ../..
          
          # 打包 emenu_post_confirmation  
          echo "📦 Packaging emenu_post_confirmation..."
          cd lambdas/emenu_post_confirmation
          npm ci --production --silent
          zip -r emenu_post_confirmation.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
          cd ../..
          
          # 打包 image_processor
          echo "📦 Packaging image_processor..."
          cd lambdas/image_processor
          npm ci --production --silent
          zip -r image_processor.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log" "build-*" "Dockerfile*"
          cd ../..
          
          # 打包 presigned_url_generator
          echo "📦 Packaging presigned_url_generator..."
          cd lambdas/presigned_url_generator
          npm ci --production --silent
          zip -r presigned_url_generator.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
          cd ../..
          
          # 打包 common_models layer
          echo "📦 Packaging common_models layer..."
          cd lambdas/layers/common_models/nodejs
          npm ci --production --silent
          cd ..
          zip -r common_models_layer.zip nodejs/ -x "*.git*" "test*" "*.md" "nodejs/node_modules/.cache/*" "*.log"
          cd ../../..
          
          # 验证打包结果
          echo "✅ Lambda packages created:"
          ls -la lambdas/*/
          ls -la lambdas/*/**.zip
          ls -la lambdas/layers/*/*.zip
          echo "📊 Package sizes:"
          find lambdas/ -name "*.zip" -exec du -h {} \;

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload Lambda Packages to S3
        run: |
          echo "📤 Uploading Lambda packages to S3..."
          
          # 上传 Lambda 函数包
          aws s3 cp lambdas/emenu_server/emenu_server.zip \
            s3://emenu-lambda-code-bucket/lambdas/emenu_server/emenu_server.zip
          
          aws s3 cp lambdas/emenu_post_confirmation/emenu_post_confirmation.zip \
            s3://emenu-lambda-code-bucket/lambdas/emenu_post_confirmation/emenu_post_confirmation.zip
          
          aws s3 cp lambdas/image_processor/image_processor.zip \
            s3://emenu-lambda-code-bucket/lambdas/image_processor/image_processor.zip
          
          aws s3 cp lambdas/presigned_url_generator/presigned_url_generator.zip \
            s3://emenu-lambda-code-bucket/lambdas/presigned_url_generator/presigned_url_generator.zip
          
          # 上传 Lambda layer
          aws s3 cp lambdas/layers/common_models/common_models_layer.zip \
            s3://emenu-lambda-code-bucket/layers/common_models/common_models_layer.zip
          
          echo "✅ All packages uploaded to S3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Init
        working-directory: infra/main
        run: terraform init

      - name: Terraform Plan (binary output)
        working-directory: infra/main
        run: terraform plan -out=tfplan

      - name: Terraform Plan (Text Output)
        working-directory: infra/main
        run: terraform plan -no-color > plan.txt

      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/main/tfplan

      - name: Upload plan.txt
        uses: actions/upload-artifact@v4
        with:
          name: plan-text
          path: infra/main/plan.txt

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan  # 必须等待 plan job 成功
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/main
        
      - name: Download plan.txt
        uses: actions/download-artifact@v4
        with:
          name: plan-text
          path: infra/main

      - name: Read Plan into Output
        id: read-plan
        working-directory: infra/main
        run: |
          {
            echo "plan<<EOF"
            cat plan.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Request Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: saJeremyQin
          minimum-approvals: 1
          issue-title: "Manual approval required for Terraform Apply"
          issue-body: |
            Terraform plan result:

            ```
            ${{ steps.read-plan.outputs.plan }}
            ```

            Please approve to proceed.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Init
        working-directory: infra/main
        run: terraform init

      - name: Terraform Apply
        if: success()
        working-directory: infra/main
        run: terraform apply -auto-approve tfplan
