name: Terraform Deploy

on:
  push:
    branches:
      - restaurantmanage  # 改为监听当前分支
    paths:
      - "infra/main/**"
      - "lambdas/**"      # 监听所有Lambda代码变更

permissions:
  issues: write       # 给 manual-approval 用
  contents: read      # checkout 和其他步骤需要
  actions: read       # workflow 本身执行需要

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Lambda打包步骤
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Check for code changes and package Lambda functions
        run: |
          echo "� Checking for code changes..."
          
          # 获取变更的文件列表
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "all")
          echo "Changed files: $CHANGED_FILES"
          
          # 初始化标志
          PACKAGE_EMENU_SERVER=false
          PACKAGE_POST_CONFIRMATION=false
          PACKAGE_IMAGE_PROCESSOR=false
          PACKAGE_PRESIGNED_URL=false
          PACKAGE_COMMON_MODELS=false
          
          # 检查是否需要重新打包
          if [[ "$CHANGED_FILES" == "all" ]] || echo "$CHANGED_FILES" | grep -q "lambdas/emenu_server/"; then
            PACKAGE_EMENU_SERVER=true
            echo "🔄 Will package emenu_server (code changed)"
          fi
          
          if [[ "$CHANGED_FILES" == "all" ]] || echo "$CHANGED_FILES" | grep -q "lambdas/emenu_post_confirmation/"; then
            PACKAGE_POST_CONFIRMATION=true
            echo "🔄 Will package emenu_post_confirmation (code changed)"
          fi
          
          if [[ "$CHANGED_FILES" == "all" ]] || echo "$CHANGED_FILES" | grep -q "lambdas/image_processor/"; then
            PACKAGE_IMAGE_PROCESSOR=true
            echo "🔄 Will package image_processor (code changed)"
          fi
          
          if [[ "$CHANGED_FILES" == "all" ]] || echo "$CHANGED_FILES" | grep -q "lambdas/presigned_url_generator/"; then
            PACKAGE_PRESIGNED_URL=true
            echo "🔄 Will package presigned_url_generator (code changed)"
          fi
          
          if [[ "$CHANGED_FILES" == "all" ]] || echo "$CHANGED_FILES" | grep -q "lambdas/layers/common_models/"; then
            PACKAGE_COMMON_MODELS=true
            echo "🔄 Will package common_models layer (code changed)"
          fi
          
          # 打包 emenu_server
          if [ "$PACKAGE_EMENU_SERVER" = true ]; then
            echo "📦 Packaging emenu_server..."
            cd lambdas/emenu_server
            npm ci --production --silent
            zip -r emenu_server.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
            cd ../..
          else
            echo "⏭️ Skipping emenu_server (no changes)"
          fi
          
          # 打包 emenu_post_confirmation  
          if [ "$PACKAGE_POST_CONFIRMATION" = true ]; then
            echo "📦 Packaging emenu_post_confirmation..."
            cd lambdas/emenu_post_confirmation
            npm ci --production --silent
            zip -r emenu_post_confirmation.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
            cd ../..
          else
            echo "⏭️ Skipping emenu_post_confirmation (no changes)"
          fi
          
          # 打包 image_processor
          if [ "$PACKAGE_IMAGE_PROCESSOR" = true ]; then
            echo "📦 Packaging image_processor..."
            cd lambdas/image_processor
            npm ci --production --silent
            zip -r image_processor.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log" "build-*" "Dockerfile*"
            cd ../..
          else
            echo "⏭️ Skipping image_processor (no changes)"
          fi
          
          # 打包 presigned_url_generator
          if [ "$PACKAGE_PRESIGNED_URL" = true ]; then
            echo "📦 Packaging presigned_url_generator..."
            cd lambdas/presigned_url_generator
            npm ci --production --silent
            zip -r presigned_url_generator.zip . -x "*.git*" "test*" "*.md" "node_modules/.cache/*" "*.log"
            cd ../..
          else
            echo "⏭️ Skipping presigned_url_generator (no changes)"
          fi
          
          # 打包 common_models layer
          if [ "$PACKAGE_COMMON_MODELS" = true ]; then
            echo "📦 Packaging common_models layer..."
            cd lambdas/layers/common_models/nodejs
            npm ci --production --silent
            cd ..
            zip -r common_models_layer.zip nodejs/ -x "*.git*" "test*" "*.md" "nodejs/node_modules/.cache/*" "*.log"
            cd ../../..
          else
            echo "⏭️ Skipping common_models layer (no changes)"
          fi
          
          # 验证打包结果
          echo "✅ Packaging completed. Created packages:"
          find lambdas/ -name "*.zip" -exec ls -la {} \; 2>/dev/null || echo "No zip files found"
          echo "📊 Package sizes:"
          find lambdas/ -name "*.zip" -exec du -h {} \; 2>/dev/null || echo "No zip files to measure"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload Lambda Packages to S3
        run: |
          echo "📤 Uploading Lambda packages to S3..."
          
          # 函数：检查文件是否需要上传（仅上传实际打包的文件）
          check_and_upload() {
            local local_file=$1
            local s3_path=$2
            local name=$3
            
            if [ -f "$local_file" ]; then
              local_hash=$(md5sum "$local_file" | cut -d' ' -f1)
              
              # 获取S3中的文件hash（如果存在）
              s3_hash=$(aws s3api head-object --bucket emenu-lambda-code-bucket --key "$s3_path" --query 'Metadata.md5hash' --output text 2>/dev/null || echo "null")
              
              if [ "$local_hash" != "$s3_hash" ]; then
                echo "🔄 Uploading $name (hash changed: $s3_hash -> $local_hash)"
                aws s3 cp "$local_file" "s3://emenu-lambda-code-bucket/$s3_path" \
                  --metadata "md5hash=$local_hash"
              else
                echo "✅ $name unchanged, skipping upload"
              fi
            else
              echo "⏭️ Skipping $name (not packaged in this run)"
            fi
          }
          
          # 上传 Lambda 函数包（只上传实际打包的文件）
          check_and_upload "lambdas/emenu_server/emenu_server.zip" "lambdas/emenu_server/emenu_server.zip" "emenu_server"
          check_and_upload "lambdas/emenu_post_confirmation/emenu_post_confirmation.zip" "lambdas/emenu_post_confirmation/emenu_post_confirmation.zip" "emenu_post_confirmation"
          check_and_upload "lambdas/image_processor/image_processor.zip" "lambdas/image_processor/image_processor.zip" "image_processor"
          check_and_upload "lambdas/presigned_url_generator/presigned_url_generator.zip" "lambdas/presigned_url_generator/presigned_url_generator.zip" "presigned_url_generator"
          
          # 上传 Lambda layer（只上传实际打包的文件）
          check_and_upload "lambdas/layers/common_models/common_models_layer.zip" "layers/common_models/common_models_layer.zip" "common_models_layer"
          
          echo "✅ Upload process completed"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Init
        working-directory: infra/main
        run: terraform init

      - name: Terraform Plan (binary output)
        working-directory: infra/main
        run: terraform plan -out=tfplan

      - name: Terraform Plan (Text Output)
        working-directory: infra/main
        run: terraform plan -no-color > plan.txt

      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/main/tfplan

      - name: Upload plan.txt
        uses: actions/upload-artifact@v4
        with:
          name: plan-text
          path: infra/main/plan.txt

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan  # 必须等待 plan job 成功
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/main
        
      - name: Download plan.txt
        uses: actions/download-artifact@v4
        with:
          name: plan-text
          path: infra/main

      - name: Read Plan into Output
        id: read-plan
        working-directory: infra/main
        run: |
          {
            echo "plan<<EOF"
            cat plan.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Request Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: saJeremyQin
          minimum-approvals: 1
          issue-title: "Manual approval required for Terraform Apply"
          issue-body: |
            Terraform plan result:

            ```
            ${{ steps.read-plan.outputs.plan }}
            ```

            Please approve to proceed.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Init
        working-directory: infra/main
        run: terraform init

      - name: Terraform Apply
        if: success()
        working-directory: infra/main
        run: terraform apply -auto-approve tfplan
