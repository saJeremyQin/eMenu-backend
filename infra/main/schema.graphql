# ====================================================================
# ENUMS & UTILITIES
# ====================================================================

enum Role {
  boss
  waiter
}

enum SubscriptionPlan {
  BASIC
  PREMIUM
}

enum OrderStatus {
  PENDING
  PAID
  CANCELLED
}

# ====================================================================
# CORE ENTITY TYPES (用于读取)
# ====================================================================

# 用户 Type (用于身份和权限管理)
type User {
  id: ID! # Mongoose _id
  cognitoId: String # Cognito Sub ID
  email: String!
  role: Role!
  restaurantId: ID # 关联的餐厅 ID (Waiter 必有)
  isDeleted: Boolean! # 软删除标记
  inviteToken: String # 仅 waiter 用户有效
  status: String # waiter registration status: 'pending', 'active', 'disabled', etc.
  createdAt: String # 用户创建时间（ISO 格式）
  updatedAt: String # 用户更新时间（ISO 格式）
}

# Waiter registration response (API Key accessible)
type RegisterWaiterPayload @aws_api_key {
  id: ID!
  cognitoId: String
  email: String!
  role: Role!
  status: String!
  createdAt: String!
}

# 餐厅 Type (包含订阅和限额信息)
type Restaurant {
  id: ID! # Mongoose _id
  bossId: ID!
  name: String!
  logoUrl: String
  address: String
  phone: String
  subscriptionPlan: SubscriptionPlan!
  subscriptionExpiry: String! # 到期日，ISO 格式，比如 "2025-12-31"

  # 业务限额字段 (从 MongoDB 动态读取)
  dishTypeLimit: Int!
  dishLimit: Int!
  waiterLimit: Int!
  
  # 关联: waiters 数组（存储 waiter 的 _id，查询时可 populate）
  waiters: [User]
}

# DishType Type
type DishType {
  id: ID!                  # Mongoose _id
  restaurantId: ID!
  name: String!
  alias: String            # Alias/Sub-title
  sortOrder: Int           # Display order (for UI control)
  isDeleted: Boolean!      # Data control (soft delete)
  isActive: Boolean!       # Business control (active/inactive)
  createdAt: String!
  updatedAt: String!
}

# Dish Type
type Dish {
  id: ID!                  # Mongoose _id
  restaurantId: ID!
  name: String!
  price: Int!              # By cents
  imageUrl: String
  description: String      # Dish description
  sortOrder: Int           # Display order within dishType (for menu layout)
  isActive: Boolean!    # Business control: active/available to customers
  isDeleted: Boolean!      # Data control: soft delete (preserves historical orders)

  createdAt: String!
  updatedAt: String!
  
  dishType: DishType!      # Relationship: DishType this dish belongs to (REQUIRED - every dish must have a valid category)
}

# 订单行项目 Type (用于OrderBatch中)
type OrderItem {
  itemId: ID!                # Item 唯一ID
  dishId: ID!
  name: String!              # Dish name at the time of order (snapshot)
  price: Int!                # Dish price at the time of order (snapshot)
  quantity: Int!
  notes: String
  status: String!            # ORDERED | CONFIRMED | CANCELLED
  confirmedAt: String        # 确认时间 (ISO format)
  cancelledAt: String        # 取消时间 (ISO format)
  cancelReason: String       # 取消原因
}

# 订单批次 Type (代表一次送厨事件)
type OrderBatch {
  batchId: ID!               # 批次唯一ID
  items: [OrderItem!]!       # 该批次包含的菜品
  confirmedAt: String!       # 送厨时间 (ISO format)
}

# 订单 Type (简化版)
type Order {
  id: ID!                    # Mongoose _id
  restaurantId: ID!
  waiterId: ID!              # 下单服务员的 User ID
  tableNumber: String!       # 桌号
  
  # 分餐信息
  dinerId: String            # "0" (整桌) / "1" / "2" / "3" (Diner number)
  tabId: String              # "default" / "tab-1" / "tab-2" (Tab ID)
  
  # 核心数据：已确认的批次
  batches: [OrderBatch!]!    # 多次送厨形成的批次数组
  
  # 金额信息
  totalConfirmedAmount: Int! # 已送厨菜品的总金额 (in cents)
  paidAmount: Int            # 已支付金额 (in cents)
  
  # 订单状态
  status: OrderStatus!       # PENDING / PAID / CANCELLED
  
  # 其他信息
  isFromCustomerScan: Boolean # Whether the order is from customer scan
  scannedAt: String          # Customer scan time
  paidAt: String             # Payment time
  createdAt: String!
  updatedAt: String!
}

# 分餐者信息 Type
type DinerInfo {
  dinerId: String!           # "0" / "1" / "2" / "3"
  tabId: String!             # "default" / "tab-1" / "tab-2"
  confirmedAmount: Int!      # 该分餐者已送厨的总金额
  batches: [OrderBatch!]!    # 该分餐者的批次列表
}

# 桌台状态 Type (用于前端展示表格卡片信息)
type TableStatus {
  tableNumber: String!       # 桌号
  activeOrders: [Order!]!    # 该桌未支付的所有订单
  totalConfirmedAmount: Int! # 该桌已送厨的总金额 (所有diner汇总)
  diners: [DinerInfo!]!      # 各分餐者的明细信息
}

# ====================================================================
# INPUT TYPES (用于写入/更新)
# ====================================================================

input RestaurantInput {
  name: String!
  logoUrl: String
  address: String
  phone: String
}

input RestaurantInfoInput {
  name: String
  logoUrl: String
  address: String
  phone: String
}

input SubscriptionUpgradeInput {
  subscriptionPlan: SubscriptionPlan!
  subscriptionExpiry: String! # 到期日期
  paymentTransactionId: String # 支付交易ID，用于记录
}

input DishTypeInput {
  name: String!
  alias: String
  sortOrder: Int
}

input DishInput {
  dishTypeId: ID!          # 必须指定分类
  name: String!
  price: Int!
  imageUrl: String
  description: String
  sortOrder: Int           # 可选，默认追加到末尾
  isActive: Boolean        # 默认为 true
}

input OrderItemInput {
  dishId: ID!
  quantity: Int!
  notes: String
}

input ConfirmOrderItemsInput {
  tableNumber: String!           # 桌号
  dinerId: String!               # "0" (整桌或第一人) / "1" / "2" / "3"...
  tabId: String!                 # "tab-0" / "tab-1" / "tab-2"...
  items: [OrderItemInput!]!      # 要送厨的菜品
  isFromCustomerScan: Boolean    # 是否来自顾客扫码 (默认 false)
}

# ====================================================================
# ROOT OPERATIONS
# ====================================================================

type Query {
  getUser(id: ID!): User
  getUserByCognito(cid: ID!): User
  # 菜单查询 (Boss/Waiter)
  getRestaurant: Restaurant
  listDishTypes: [DishType]
  listDishes(dishTypeId: ID): [Dish]
  listWaiters: [User]

  # 订单查询
  listOrders(status: OrderStatus, dateFrom: String, dateTo: String): [Order]
  getOrder(id: ID!): Order
  
  # 新增：桌台状态查询 (用于前端表格列表)
  getTableStatus(tableNumber: String!): TableStatus
}

type Mutation {
  # 餐厅与 Boss 管理
  createRestaurant(input: RestaurantInput!): Restaurant # 仅创建 BASIC 版本
  updateRestaurantInfo(input: RestaurantInfoInput!): Restaurant # 更新餐厅基本信息
  updateRestaurantSubscriptionPlan(input: SubscriptionUpgradeInput!): Restaurant # 订阅升级
  
  # invite waiter, delete waiter
  inviteWaiter(email: String!): User
  registerWaiter(token: String!, password: String!): RegisterWaiterPayload @aws_api_key # waiter registration via inviteToken (API Key access)
  deleteWaiter(id: ID!): Boolean
  activateWaiter(token: String!, password: String!): Boolean

  # 菜单管理
  createDishType(input: DishTypeInput!): DishType
  updateDishType(id: ID!, input: DishTypeInput!): DishType
  deleteDishType(id: ID!): DishType # 软删除，返回更新后的对象
  toggleDishTypeStatus(id: ID!, isActive: Boolean!): DishType # 切换分类状态
  
  createDish(input: DishInput!): Dish
  updateDish(id: ID!, input: DishInput!): Dish
  deleteDish(id: ID!): Dish # 软删除，返回更新后的对象
  toggleDishStatus(id: ID!, isActive: Boolean!): Dish # Switch dish availability status

  # 订单操作
  # 1. 送厨（自动创建或关联订单，形成一个batch）
  confirmOrderItems(input: ConfirmOrderItemsInput!): Order
  
  # 2. 继续添加菜品并送厨（可多次调用，每次形成新batch）
  # 使用同一个confirmOrderItems接口，根据 tableNumber + dinerId + tabId 自动关联或创建订单
  
  # 3. 取消订单中的单个菜品项
  cancelOrderItem(
    orderId: ID!,
    itemId: ID!,
    reason: String
  ): Order
  
  # 4. 支付订单（全额支付）
  payOrder(orderId: ID!): Order
  
  # 5. 取消整个订单
  cancelOrder(orderId: ID!): Order
}
