# ====================================================================
# ENUMS & UTILITIES
# ====================================================================

enum Role {
  boss
  waiter
}

enum SubscriptionPlan {
  BASIC
  PREMIUM
}

enum OrderStatus {
  PENDING
  CONFIRMED # 已确认，正在制作
  COMPLETED # 已完成/结账
  CANCELLED
}

# ====================================================================
# CORE ENTITY TYPES (用于读取)
# ====================================================================

# 用户 Type (用于身份和权限管理)
type User {
  id: ID! # Mongoose _id
  cognitoId: String # Cognito Sub ID
  email: String!
  role: Role!
  restaurantId: ID # 关联的餐厅 ID (Waiter 必有)
  isDeleted: Boolean! # 软删除标记
  inviteToken: String # 仅 waiter 用户有效
  status: String # waiter registration status: 'pending', 'active', 'disabled', etc.
  createdAt: String # 用户创建时间（ISO 格式）
  updatedAt: String # 用户更新时间（ISO 格式）
}

# Waiter registration response (API Key accessible)
type RegisterWaiterPayload @aws_api_key {
  id: ID!
  cognitoId: String
  email: String!
  role: Role!
  status: String!
  createdAt: String!
}

# 餐厅 Type (包含订阅和限额信息)
type Restaurant {
  id: ID! # Mongoose _id
  bossId: ID!
  name: String!
  image: String
  address: String
  phone: String
  subscriptionPlan: SubscriptionPlan!
  subscriptionExpiry: String! # 到期日，ISO 格式，比如 "2025-12-31"

  # 业务限额字段 (从 MongoDB 动态读取)
  dishTypeLimit: Int!
  dishLimit: Int!
  waiterLimit: Int!
  
  # 关联: waiters 数组（存储 waiter 的 _id，查询时可 populate）
  waiters: [User]
}

# DishType Type
type DishType {
  id: ID!                  # Mongoose _id
  restaurantId: ID!
  name: String!
  alias: String            # Alias/Sub-title
  sortOrder: Int           # Display order (for UI control)
  isDeleted: Boolean!      # Data control (soft delete)
  isActive: Boolean!       # Business control (active/inactive)
  createdAt: String!
  updatedAt: String!
}

# Dish Type
type Dish {
  id: ID!                  # Mongoose _id
  restaurantId: ID!
  name: String!
  price: Int!              # By cents
  imageUrl: String
  description: String      # Dish description
  sortOrder: Int           # Display order within dishType (for menu layout)
  isActive: Boolean!    # Business control: active/available to customers
  isDeleted: Boolean!      # Data control: soft delete (preserves historical orders)

  createdAt: String!
  updatedAt: String!
  
  dishType: DishType!      # Relationship: DishType this dish belongs to (REQUIRED - every dish must have a valid category)
}

# 订单行项目 Type (嵌入在 Order 中)
type OrderItem {
  dishId: ID!
  name: String! # 下单时的菜品名称 (历史快照)
  price: Int! # 下单时的菜品价格 (历史快照)
  quantity: Int!
  notes: String
}

# 订单 Type
type Order {
  id: ID! # Mongoose _id
  restaurantId: ID!
  waiterId: ID! # 下单服务员的 User ID
  tableNumber: String!
  status: OrderStatus!
  totalAmount: Int!
  createdAt: String!
  
  # 嵌入列表: 订单包含的行项目
  items: [OrderItem!] 
}

# ====================================================================
# INPUT TYPES (用于写入/更新)
# ====================================================================

input RestaurantInput {
  name: String!
  image: String
  address: String
  phone: String
}

input RestaurantInfoInput {
  name: String
  image: String
  address: String
  phone: String
}

input SubscriptionUpgradeInput {
  subscriptionPlan: SubscriptionPlan!
  subscriptionExpiry: String! # 到期日期
  paymentTransactionId: String # 支付交易ID，用于记录
}

input DishTypeInput {
  name: String!
  alias: String
  sortOrder: Int
}

input DishInput {
  dishTypeId: ID!          # 必须指定分类
  name: String!
  price: Int!
  image: String
  description: String
  sortOrder: Int           # 可选，默认追加到末尾
  isActive: Boolean     # 默认为 true
}

input OrderItemInput {
  dishId: ID!
  quantity: Int!
  notes: String
}

input OrderInput {
  tableNumber: String!
  items: [OrderItemInput!]!
}

# ====================================================================
# ROOT OPERATIONS
# ====================================================================

type Query {
  getUser(id: ID!): User
  getUserByCognito(cid: ID!): User
  # 菜单查询 (Boss/Waiter)
  getRestaurant: Restaurant
  listDishTypes: [DishType]
  listDishes(dishTypeId: ID): [Dish]
  listWaiters: [User]

  # 订单查询
  listOrders(status: OrderStatus, dateFrom: String, dateTo: String): [Order]
}

type Mutation {
  # 餐厅与 Boss 管理
  createRestaurant(input: RestaurantInput!): Restaurant # 仅创建 BASIC 版本
  updateRestaurantInfo(input: RestaurantInfoInput!): Restaurant # 更新餐厅基本信息
  updateRestaurantSubscriptionPlan(input: SubscriptionUpgradeInput!): Restaurant # 订阅升级
  
  # invite waiter, delete waiter
  inviteWaiter(email: String!): User
  registerWaiter(token: String!, password: String!): RegisterWaiterPayload @aws_api_key # waiter registration via inviteToken (API Key access)
  deleteWaiter(id: ID!): Boolean
  activateWaiter(token: String!, password: String!): Boolean

  # 菜单管理
  createDishType(input: DishTypeInput!): DishType
  updateDishType(id: ID!, input: DishTypeInput!): DishType
  deleteDishType(id: ID!): DishType # 软删除，返回更新后的对象
  toggleDishTypeStatus(id: ID!, isActive: Boolean!): DishType # 切换分类状态
  
  createDish(input: DishInput!): Dish
  updateDish(id: ID!, input: DishInput!): Dish
  deleteDish(id: ID!): Dish # 软删除，返回更新后的对象
  toggleDishStatus(id: ID!, isActive: Boolean!): Dish # Switch dish availability status

  # 订单操作
  placeOrder(input: OrderInput!): Order
  checkoutOrder(orderId: ID!): Order
  updateOrderStatus(orderId: ID!, status: OrderStatus!): Order
}
